name: Build and publish dev-build pre-release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile main.py --distpath dist --workpath build --specpath build

      - name: Package tar.gz
        run: |
          mkdir -p release
          exe_name=$(basename main.py .py)
          if [ -f dist/$exe_name ]; then
            cp dist/$exe_name release/
            chmod +x release/$exe_name
          else
            ls -la dist
            echo "Built executable not found" && exit 1
          fi
          tar -czf main-dev-build.tar.gz -C release .
          ls -lh main-dev-build.tar.gz

      - name: Create pre-release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: dev-build
          release_name: dev-build
          body: Automated dev build from workflow
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./main-dev-build.tar.gz
          asset_name: main-dev-build.tar.gz
          asset_content_type: application/gzip
